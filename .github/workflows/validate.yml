name: Validate Mod

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run mod validator
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\validate_mod.ps1 -ModPath .
