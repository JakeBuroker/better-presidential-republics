 modifier_vptl_presidential_first_term_desc:0 "This ruler has one elected presidential term recorded. The modifier expiry marks the expected end of a BPR-recorded elected term; an initial incumbent instead uses the country's scheduled election date.\n\nService type: #v [Character.GetCustom('vptl_presidential_accession_type')]#!"
