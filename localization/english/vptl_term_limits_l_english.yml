 vptl_presidential_successor_tooltip:0 "#header [GetPlayer.GetCustom('vptl_presidential_successor_title')]#!\n$TOOLTIP_DELIMITER$\n[GetPlayer.GetCustom('vptl_presidential_successor_office_type')]"
 vptl_presidential_successor_office_type_true_vp:0 "This is treated as a true vice-presidential office: an elected or party-linked deputy who stands first in line if the president dies or is removed."
 vptl_presidential_successor_office_type_legislative:0 "This is treated as a constitutional legislative successor rather than a true vice president. The office stands in for countries where the next in line is normally the Senate or assembly leadership."
 vptl_presidential_successor_office_type_cabinet:0 "This is treated as a cabinet or senior-minister successor. It is a historical/gameplay stand-in for countries without a stable vice-presidential office."
 vptl_presidential_successor_office_type_standin:0 "This is a gameplay succession stand-in, chosen from eligible politicians to keep presidential transitions stable when the country has no clear vice-presidential office."
 notification_vptl_presidential_transition_name:0 "Presidential Transition"
 notification_vptl_presidential_transition_desc:0 "[SCOPE.sCharacter('vptl_presidential_transition_ruler_scope').GetFullName] became [SCOPE.sCountry('vptl_presidential_transition_country_scope').GetAdjective] [SCOPE.sCharacter('vptl_presidential_transition_ruler_scope').GetPrimaryRoleTitle] No. [SCOPE.sCharacter('vptl_presidential_transition_ruler_scope').MakeScope.Var('vptl_presidential_order_number').GetValue|v0] by #v [SCOPE.sCharacter('vptl_presidential_transition_ruler_scope').GetCustom('vptl_presidential_accession_type')]#!."
 notification_vptl_presidential_transition_tooltip:0 "#header $notification_vptl_presidential_transition_name$#!\n$TOOLTIP_DELIMITER$\n$notification_vptl_presidential_transition_desc$"

