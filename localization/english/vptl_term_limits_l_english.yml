 vptl_presidential_constitutional_tooltip:0 "#header Presidential Republic#!\n$TOOLTIP_DELIMITER$\n[GetPlayer.GetCustom('vptl_presidential_constitutional_tooltip_note')]"
 vptl_presidential_constitutional_tooltip_note_fixed:0 "The president holds a fixed executive term and does not depend on parliamentary confidence to remain in office. This usually separates executive authority from day-to-day legislative majorities."
 vptl_presidential_constitutional_tooltip_note_concentrated:0 "The presidency is the central executive office. Under autocratic or caudillo-style arrangements, constitutional succession may exist on paper while real authority remains concentrated around the president."
 vptl_presidential_constitutional_tooltip_note_default:0 "The president is treated as the chief executive for term-limit and succession tracking."
